<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nawab Tours - Fateh Sagar Lake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img {
            height: 600px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Carousel Section -->
    <div id="coverCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#coverCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#coverCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#coverCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://source.unsplash.com/1200x600/?palace,india" class="d-block w-100" alt="Beautiful Palace in India">
            </div>
            <div class="carousel-item">
                <img src="https://source.unsplash.com/1200x600/?lake,udaipur" class="d-block w-100" alt="Scenic Lake View in Udaipur">
            </div>
            <div class="carousel-item">
                <img src="https://source.unsplash.com/1200x600/?heritage,india" class="d-block w-100" alt="Heritage Site in India">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#coverCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#coverCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Content Section -->
    <div class="container text-center mt-4">
        <h3 class="text-danger">Incredible</h3>
        <h1 class="fw-bold">Fateh Sagar Lake</h1>
        <p class="text-muted">
            Fateh Sagar Lake is situated in the city of Udaipur in the Indian state of Rajasthan. 
            It is an artificial lake named after Maharana Fateh Singh of Udaipur.
        </p>
        <a href="#" class="btn btn-warning px-4 py-2 fw-bold">KNOW MORE</a>
    </div>

    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
